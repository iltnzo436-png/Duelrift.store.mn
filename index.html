<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DuelRift Store</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Poppins:wght@400;500;600;700&display=swap');

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  color:white;
  font-family:Poppins,Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 10%,rgba(0,255,220,.12),transparent 30%),
    radial-gradient(circle at 85% 20%,rgba(125,70,255,.15),transparent 30%),
    linear-gradient(135deg,#050713,#0a1020 50%,#070914);
  min-height:100vh;
}

/* BACKGROUND GLOW */

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 0%,rgba(0,255,210,.06),transparent 35%);
}

/* HEADER */

header{
  position:relative;
  padding:55px 20px 35px;
  text-align:center;
}

.logo{
  font-family:Orbitron,sans-serif;
  font-size:clamp(34px,8vw,70px);
  font-weight:800;
  letter-spacing:3px;
  background:linear-gradient(90deg,#00ffe0,#8d5cff,#00ffe0);
  background-size:200%;
  -webkit-background-clip:text;
  color:transparent;
  animation:gradient 4s linear infinite;
}

@keyframes gradient{
  0%{background-position:0%}
  100%{background-position:200%}
}

.subtitle{
  color:#8995ad;
  margin-top:10px;
  font-size:15px;
}

/* NAV */

nav{
  max-width:1100px;
  margin:0 auto 25px;
  padding:0 20px;
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

.nav-btn{
  background:rgba(18,28,49,.75);
  border:1px solid #263654;
  color:#cbd5e8;
  padding:10px 18px;
  border-radius:12px;
  cursor:pointer;
  transition:.2s;
}

.nav-btn:hover{
  border-color:#00ffe0;
  color:#00ffe0;
}

/* CONTAINER */

.container{
  max-width:1150px;
  margin:auto;
  padding:20px;
}

.section-title{
  font-family:Orbitron,sans-serif;
  text-align:center;
  font-size:28px;
  margin:20px 0 30px;
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:22px;
}

.card{
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,#111b30,#0d1527);
  border:1px solid #263654;
  border-radius:22px;
  padding:14px;
  transition:.3s;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.card:before{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  background:#00ffe0;
  filter:blur(80px);
  opacity:.07;
  top:-50px;
  right:-50px;
}

.card:hover{
  transform:translateY(-8px);
  border-color:#00ffe0;
  box-shadow:
    0 0 25px rgba(0,255,224,.12),
    0 20px 50px rgba(0,0,0,.35);
}

.item-image{
  width:100%;
  height:210px;
  object-fit:cover;
  border-radius:16px;
  background:#070b15;
  display:block;
}

.item-name{
  font-family:Orbitron,sans-serif;
  font-size:20px;
  margin:17px 5px 7px;
}

.price{
  color:#00ffe0;
  font-size:24px;
  font-weight:700;
  margin:5px;
}

.stock{
  color:#8995ad;
  font-size:14px;
  margin:8px 5px 15px;
}

.order{
  width:100%;
  padding:14px;
  border:0;
  border-radius:13px;
  color:#04100e;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  background:linear-gradient(90deg,#00ffd5,#00bfff);
  transition:.2s;
}

.order:hover{
  transform:scale(1.02);
  box-shadow:0 0 22px rgba(0,255,220,.3);
}

/* BADGE */

.badge{
  position:absolute;
  top:25px;
  left:25px;
  background:linear-gradient(90deg,#7b4dff,#b05cff);
  padding:6px 10px;
  border-radius:8px;
  font-size:11px;
  font-weight:700;
  z-index:2;
}

/* FOOTER */

footer{
  text-align:center;
  padding:55px 20px 30px;
  color:#65738d;
  font-size:13px;
}

/* ADMIN BUTTON */

.admin-button{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:50;
  background:#111c31;
  color:#fff;
  border:1px solid #344666;
  border-radius:14px;
  padding:12px 17px;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(0,0,0,.4);
}

.admin-button:hover{
  border-color:#00ffe0;
  color:#00ffe0;
}

/* ADMIN */

.admin{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  overflow-y:auto;
  background:
    radial-gradient(circle at 20% 10%,rgba(0,255,220,.08),transparent 30%),
    #060a14;
  padding:25px 15px;
}

.admin-box{
  max-width:750px;
  margin:auto;
}

.admin-title{
  font-family:Orbitron,sans-serif;
  color:#00ffe0;
  font-size:30px;
}

.admin-card{
  background:#111b2e;
  border:1px solid #263654;
  border-radius:18px;
  padding:20px;
  margin:18px 0;
}

input{
  width:100%;
  padding:13px;
  margin:7px 0 15px;
  background:#080e1c;
  color:white;
  border:1px solid #2b3c5b;
  border-radius:10px;
  outline:none;
}

input:focus{
  border-color:#00ffe0;
}

.save{
  background:#00d9a0;
  color:#03100d;
  border:0;
  padding:11px 16px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}

.delete{
  background:#d94350;
  color:white;
  border:0;
  padding:11px 16px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  margin-left:5px;
}

.close{
  background:#202d45;
  color:white;
  border:1px solid #344666;
  padding:11px 17px;
  border-radius:10px;
  cursor:pointer;
}

hr{
  border:0;
  border-top:1px solid #263654;
  margin:28px 0;
}

/* MOBILE */

@media(max-width:600px){

  header{
    padding-top:40px;
  }

  .logo{
    font-size:36px;
  }

  .products{
    grid-template-columns:1fr;
  }

  .item-image{
    height:220px;
  }

}
</style>
</head>

<body>

<header>

  <div class="logo">
    ⚡ DUELRIFT STORE
  </div>

  <div class="subtitle">
    Premium Roblox Items • Fast Delivery • Trusted Store
  </div>

</header>

<nav>
  <button class="nav-btn" onclick="scrollToShop()">
    🛒 SHOP
  </button>

  <button class="nav-btn" onclick="openAdmin()">
    ⚙️ ADMIN
  </button>
</nav>

<div class="container" id="shop">

  <div class="section-title">
    🔥 FEATURED ITEMS
  </div>

  <div class="products" id="products"></div>

</div>

<footer>
  © 2026 DuelRift Store
  <br>
  Game Items • Roblox
</footer>

<button class="admin-button" onclick="openAdmin()">
  ⚙️ Admin
</button>

<!-- ADMIN PANEL -->

<div class="admin" id="adminPanel">

  <div class="admin-box">

    <h1 class="admin-title">
      ⚙️ DUELRIFT ADMIN
    </h1>

    <button class="close" onclick="closeAdmin()">
      ← BACK TO STORE
    </button>

    <hr>

    <div class="admin-card">

      <h2>➕ Add New Item</h2>

      <label>Item name</label>

      <input
        id="newName"
        placeholder="Dragonfly"
      >

      <label>Price</label>

      <input
        id="newPrice"
        type="number"
        placeholder="1000"
      >

      <label>Stock</label>

      <input
        id="newStock"
        type="number"
        placeholder="3"
      >

      <label>Image URL</label>

      <input
        id="newImage"
        placeholder="https://..."
      >

      <button class="save" onclick="addProduct()">
        ➕ ADD ITEM
      </button>

    </div>

    <h2>📦 Manage Items</h2>

    <div id="adminProducts"></div>

  </div>

</div>

<script>

/* PRODUCTS */

let products = JSON.parse(
  localStorage.getItem("duelrift_products")
) || [

  {
    id:1,
    name:"Dragonfly",
    price:1000,
    stock:3,
    image:"https://placehold.co/800x500/101b30/00ffe0?text=DRAGONFLY",
    popular:true
  },

  {
    id:2,
    name:"Unicorn",
    price:1500,
    stock:6,
    image:"https://placehold.co/800x500/101b30/8d5cff?text=UNICORN",
    popular:true
  },

  {
    id:3,
    name:"Fire Fly",
    price:1500,
    stock:6,
    image:"https://placehold.co/800x500/101b30/ff5c8a?text=FIRE+FLY",
    popular:false
  }

];


/* SAVE */

function saveProducts(){

  localStorage.setItem(
    "duelrift_products",
    JSON.stringify(products)
  );

}


/* SHOW PRODUCTS */

function showProducts(){

  const box =
    document.getElementById("products");

  box.innerHTML="";

  products.forEach(product=>{

    box.innerHTML += `

      <div class="card">

        ${
          product.popular
          ? '<div class="badge">🔥 POPULAR</div>'
          : ''
        }

        <img
          class="item-image"
          src="${product.image}"
          alt="${product.name}"
        >

        <div class="item-name">
          ${product.name}
        </div>

        <div class="price">
          ${Number(product.price).toLocaleString()}₮
        </div>

        <div class="stock">
          📦 Stock: ${product.stock}
        </div>

        <button
          class="order"
          onclick="orderItem('${product.name}')"
        >
          🛒 ORDER NOW
        </button>

      </div>

    `;

  });

}


/* ORDER */

function orderItem(name){

  alert(
    "🛒 " +
    name +
    " захиалах хэсэг удахгүй нээгдэнэ!"
  );

}


/* ADMIN OPEN */

function openAdmin(){

  document.getElementById(
    "adminPanel"
  ).style.display="block";

  showAdmin();

}


/* ADMIN CLOSE */

function closeAdmin(){

  document.getElementById(
    "adminPanel"
  ).style.display="none";

}


/* ADMIN ITEMS */

function showAdmin(){

  const box =
    document.getElementById("adminProducts");

  box.innerHTML="";

  products.forEach(product=>{

    box.innerHTML += `

      <div class="admin-card">

        <h3>
          📦 ${product.name}
        </h3>

        <label>Name</label>

        <input
          id="name-${product.id}"
          value="${product.name}"
        >

        <label>Price</label>

        <input
          id="price-${product.id}"
          type="number"
          value="${product.price}"
        >

        <label>Stock</label>

        <input
          id="stock-${product.id}"
          type="number"
          value="${product.stock}"
        >

        <label>Image URL</label>

        <input
          id="image-${product.id}"
          value="${product.image}"
        >

        <button
          class="save"
          onclick="updateProduct(${product.id})"
        >
          💾 SAVE
        </button>

        <button
          class="delete"
          onclick="deleteProduct(${product.id})"
        >
          🗑️ DELETE
        </button>

      </div>

    `;

  });

}


/* ADD */

function addProduct(){

  const name =
    document.getElementById(
      "newName"
    ).value.trim();

  const price =
    Number(
      document.getElementById(
        "newPrice"
      ).value
    );

  const stock =
    Number(
      document.getElementById(
        "newStock"
      ).value
    );

  const image =
    document.getElementById(
      "newImage"
    ).value.trim();


  if(!name || !price){

    alert(
      "⚠️ Item name болон price оруулна уу."
    );

    return;
  }


  products.push({

    id:Date.now(),

    name:name,

    price:price,

    stock:stock || 0,

    image:
      image ||
      "https://placehold.co/800x500/101b30/00ffe0?text=NEW+ITEM",

    popular:false

  });


  saveProducts();

  showProducts();

  showAdmin();


  document.getElementById(
    "newName"
  ).value="";

  document.getElementById(
    "newPrice"
  ).value="";

  document.getElementById(
    "newStock"
  ).value="";

  document.getElementById(
    "newImage"
  ).value="";


  alert("✅ Item нэмэгдлээ!");

}


/* UPDATE */

function updateProduct(id){

  const product =
    products.find(
      p=>p.id===id
    );

  if(!product)return;


  product.name =
    document.getElementById(
      "name-"+id
    ).value;

  product.price =
    Number(
      document.getElementById(
        "price-"+id
      ).value
    );

  product.stock =
    Number(
      document.getElementById(
        "stock-"+id
      ).value
    );

  product.image =
    document.getElementById(
      "image-"+id
    ).value;


  saveProducts();

  showProducts();

  showAdmin();

  alert("✅ Item шинэчлэгдлээ!");

}


/* DELETE */

function deleteProduct(id){

  if(
    !confirm(
      "Энэ item-ийг устгах уу?"
    )
  ){
    return;
  }


  products =
    products.filter(
      p=>p.id!==id
    );


  saveProducts();

  showProducts();

  showAdmin();

}


/* SCROLL */

function scrollToShop(){

  document.getElementById(
    "shop"
  ).scrollIntoView({
    behavior:"smooth"
  });

}


/* START */

showProducts();

</script>

</body>
</html>
