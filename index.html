<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DuelRift Store</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 20% 0%,#123b4a,transparent 35%),
    radial-gradient(circle at 90% 20%,#29154d,transparent 35%),
    #060914;
  color:white;
}

header{
  padding:35px 20px;
  text-align:center;
}

.logo{
  font-size:42px;
  font-weight:900;
  color:#00ffe0;
  text-shadow:0 0 25px #00ffe055;
}

header p{
  color:#8995aa;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.topbar{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:30px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  cursor:pointer;
  font-weight:bold;
}

.btn{
  background:#132138;
  color:white;
  border:1px solid #2b3e5d;
}

.primary{
  background:#00e0b5;
  color:#03100d;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
}

.card{
  background:#111a2c;
  border:1px solid #263957;
  border-radius:18px;
  padding:15px;
  transition:.2s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:#00ffe0;
}

.card img{
  width:100%;
  height:190px;
  object-fit:cover;
  border-radius:13px;
}

.card h2{
  margin:15px 0 7px;
}

.price{
  color:#00ffe0;
  font-size:23px;
  font-weight:bold;
}

.stock{
  color:#8995aa;
  margin:8px 0 15px;
}

.buy{
  width:100%;
  background:linear-gradient(90deg,#00e0b5,#00bfff);
  color:#02100d;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  z-index:20;
  padding:20px;
  overflow:auto;
}

.modal-box{
  max-width:450px;
  margin:60px auto;
  background:#101a2c;
  border:1px solid #304564;
  border-radius:18px;
  padding:25px;
}

.modal-box h2{
  color:#00ffe0;
}

input{
  width:100%;
  padding:13px;
  margin:7px 0 15px;
  border-radius:9px;
  border:1px solid #344968;
  background:#080e1b;
  color:white;
}

.qr{
  width:220px;
  height:220px;
  display:block;
  margin:20px auto;
  background:#202b40;
  object-fit:cover;
}

.notice{
  padding:13px;
  background:#16243a;
  border-radius:10px;
  color:#aebbd0;
  font-size:14px;
  line-height:1.5;
}

.close{
  background:#27364e;
  color:white;
  margin-top:10px;
}

.account{
  color:#00ffe0;
  font-weight:bold;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<header>
  <div class="logo">⚡ DUELRIFT STORE</div>
  <p>Roblox Digital Store</p>
</header>

<div class="container">

  <div class="topbar">

    <button class="btn" onclick="openLogin()">
      🔐 Login
    </button>

    <button class="btn" onclick="openRegister()">
      👤 Register
    </button>

    <button class="btn hidden" id="profileBtn" onclick="openProfile()">
      👤 <span id="usernameText"></span>
    </button>

    <button class="btn hidden" id="logoutBtn" onclick="logout()">
      Logout
    </button>

  </div>

  <div class="products" id="products"></div>

</div>


<!-- REGISTER -->

<div class="modal" id="registerModal">

  <div class="modal-box">

    <h2>👤 Create Account</h2>

    <input id="regUsername" placeholder="Username">

    <input id="regEmail" type="email" placeholder="Email">

    <input id="regPassword" type="password" placeholder="Password">

    <button class="primary" onclick="register()">
      CREATE ACCOUNT
    </button>

    <br><br>

    <button class="close" onclick="closeAll()">
      Close
    </button>

  </div>

</div>


<!-- LOGIN -->

<div class="modal" id="loginModal">

  <div class="modal-box">

    <h2>🔐 Login</h2>

    <input id="loginEmail" type="email" placeholder="Email">

    <input id="loginPassword" type="password" placeholder="Password">

    <button class="primary" onclick="login()">
      LOGIN
    </button>

    <br><br>

    <button class="close" onclick="closeAll()">
      Close
    </button>

  </div>

</div>


<!-- CHECKOUT -->

<div class="modal" id="checkoutModal">

  <div class="modal-box">

    <h2>🛒 Checkout</h2>

    <p>
      Item:
      <span class="account" id="checkoutName"></span>
    </p>

    <p>
      Үнэ:
      <span class="account" id="checkoutPrice"></span>
    </p>

    <div class="notice">
      QPay төлбөрийг backend-ээр баталгаажуулсны
      дараа захиалга амжилттай болно.
    </div>

    <div class="qr">
      <!-- Энд жинхэнэ QPay QR-г backend-ээс оруулна -->
      <div style="padding:80px 15px;text-align:center;color:#8995aa">
        QPay QR
      </div>
    </div>

    <button class="primary" style="width:100%"
      onclick="checkPayment()">
      💳 PAYMENT CHECK
    </button>

    <button class="close" style="width:100%"
      onclick="closeAll()">
      Close
    </button>

  </div>

</div>


<!-- DELIVERY -->

<div class="modal" id="deliveryModal">

  <div class="modal-box">

    <h2>✅ Order Complete</h2>

    <p>Төлбөр баталгаажлаа.</p>

    <div class="notice">
      Таны худалдан авсан бүтээгдэхүүний
      хүргэлтийг энд харуулна.
    </div>

    <br>

    <button class="primary"
      onclick="showDelivery()">
      📦 View Delivery
    </button>

    <p id="deliveryText"></p>

    <button class="close"
      onclick="closeAll()">
      Close
    </button>

  </div>

</div>


<script>

/*
  DEMO DATA

  Жинхэнэ хэрэглэгчийн password,
  QPay мэдээлэл энд хадгалах ёсгүй.
*/

const products = [

  {
    id:1,
    name:"Dragonfly Account",
    price:4000,
    stock:3,
    image:"https://placehold.co/700x450/111a2c/00ffe0?text=DRAGONFLY"
  },

  {
    id:2,
    name:"Unicorn Account",
    price:8000,
    stock:2,
    image:"https://placehold.co/700x450/111a2c/8d5cff?text=UNICORN"
  },

  {
    id:3,
    name:"Fire Fly Account",
    price:11500,
    stock:5,
    image:"https://placehold.co/700x450/111a2c/ff5c8a?text=FIRE+FLY"
  }

];


let selectedProduct = null;
let currentUser = null;


/* PRODUCTS */

function showProducts(){

  const box =
    document.getElementById("products");

  box.innerHTML = "";

  products.forEach(product => {

    box.innerHTML += `

      <div class="card">

        <img src="${product.image}">

        <h2>${product.name}</h2>

        <div class="price">
          ${product.price.toLocaleString()}₮
        </div>

        <div class="stock">
          📦 Stock: ${product.stock}
        </div>

        <button
          class="buy"
          onclick="buy(${product.id})">
          🛒 BUY NOW
        </button>

      </div>

    `;

  });

}


/* REGISTER */

function openRegister(){
  closeAll();
  document.getElementById(
    "registerModal"
  ).style.display="block";
}


function register(){

  const username =
    document.getElementById("regUsername").value.trim();

  const email =
    document.getElementById("regEmail").value.trim();

  const password =
    document.getElementById("regPassword").value;

  if(!username || !email || !password){

    alert("Бүх талбарыг бөглөнө үү.");

    return;
  }

  /*
    DEMO ONLY.

    Жинхэнэ хувилбарт password-ыг
    localStorage-д хадгалахгүй.
    Supabase Authentication ашиглана.
  */

  currentUser = {
    username:username,
    email:email
  };

  updateUserUI();

  alert("✅ Account амжилттай үүслээ!");

  closeAll();

}


/* LOGIN */

function openLogin(){
  closeAll();

  document.getElementById(
    "loginModal"
  ).style.display="block";
}


function login(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if(!email || !password){

    alert("Email болон password оруулна уу.");

    return;
  }

  /*
    DEMO ONLY.
    Жинхэнэ login backend authentication-тай байна.
  */

  currentUser = {
    username:email.split("@")[0],
    email:email
  };

  updateUserUI();

  alert("✅ Login амжилттай!");

  closeAll();

}


/* USER UI */

function updateUserUI(){

  document.getElementById(
    "profileBtn"
  ).classList.remove("hidden");

  document.getElementById(
    "logoutBtn"
  ).classList.remove("hidden");

  document.getElementById(
    "usernameText"
  ).textContent =
    currentUser.username;

}


/* LOGOUT */

function logout(){

  currentUser = null;

  document.getElementById(
    "profileBtn"
  ).classList.add("hidden");

  document.getElementById(
    "logoutBtn"
  ).classList.add("hidden");

}


/* BUY */

function buy(id){

  if(!currentUser){

    alert(
      "🛑 Худалдан авахын өмнө Register/Login хийнэ үү."
    );

    openLogin();

    return;
  }

  selectedProduct =
    products.find(p => p.id === id);

  document.getElementById(
    "checkoutName"
  ).textContent =
    selectedProduct.name;

  document.getElementById(
    "checkoutPrice"
  ).textContent =
    selectedProduct.price.toLocaleString()
    + "₮";

  closeAll();

  document.getElementById(
    "checkoutModal"
  ).style.display="block";

}


/* PAYMENT */

function checkPayment(){

  /*
    ЭНЭ БОЛ DEMO.

    Жинхэнэ QPay төлбөрийг client-side
    alert-аар баталгаажуулж болохгүй.

    Backend QPay API-аас төлбөрийн
    status шалгана.
  */

  const paid =
    confirm(
      "Demo: QPay төлбөр төлөгдсөн гэж үзэх үү?"
    );

  if(!paid) return;

  closeAll();

  document.getElementById(
    "deliveryModal"
  ).style.display="block";

}


/* DELIVERY */

function showDelivery(){

  /*
    Жинхэнэ бүтээгдэхүүний account credentials
    backend/database дээр хамгаалагдсан байх ёстой.
  */

  document.getElementById(
    "deliveryText"
  ).innerHTML = `
    <br>
    📦 Таны захиалга бэлэн боллоо.<br><br>
    Account-ийн хүргэлтийн мэдээллийг
    баталгаатай delivery системээс авна.
  `;

}


/* PROFILE */

function openProfile(){

  if(!currentUser) return;

  alert(
    "👤 Username: "
    + currentUser.username
    + "\n📧 Email: "
    + currentUser.email
  );

}


/* CLOSE */

function closeAll(){

  document
    .querySelectorAll(".modal")
    .forEach(modal=>{
      modal.style.display="none";
    });

}


showProducts();

</script>

</body>
</html>
